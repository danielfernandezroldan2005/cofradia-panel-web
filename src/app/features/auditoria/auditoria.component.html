<div class="auditoria-container">
  <h2>Registro de Auditoría</h2>
  <p>Historial y registro de cambios realizados en el sistema.</p>

  <mat-card class="mat-elevation-z4">
    <mat-card-content>
      <!-- Header row containing Search bar and "Añadir Auditoría" button -->
      <div class="table-header">
        <mat-form-field appearance="outline" class="buscador-auditoria">
          <mat-label>Buscar auditoría...</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Ej. MODIFICAR">
        </mat-form-field>

        <button mat-flat-button color="primary" (click)="openAddDialog()">
          Añadir Auditoría
        </button>
      </div>

      <table mat-table [dataSource]="dataSource">

        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> Nº </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <!-- Entidad Afectada Column -->
        <ng-container matColumnDef="entidadAfectada">
          <th mat-header-cell *matHeaderCellDef> Entidad Afectada </th>
          <td mat-cell *matCellDef="let element"> {{element.entidadAfectada}} </td>
        </ng-container>

        <!-- Operacion Column -->
        <ng-container matColumnDef="operacion">
          <th mat-header-cell *matHeaderCellDef> Operación </th>
          <td mat-cell *matCellDef="let element"> {{element.operacion}} </td>
        </ng-container>

        <!-- Fecha Operacion Column -->
        <ng-container matColumnDef="fechaOperacion">
          <th mat-header-cell *matHeaderCellDef> Fecha de Operación </th>
          <td mat-cell *matCellDef="let element"> {{element.fechaOperacion}} </td>
        </ng-container>

        <!-- Usuario Column -->
        <ng-container matColumnDef="usuario">
          <th mat-header-cell *matHeaderCellDef> Usuario </th>
          <td mat-cell *matCellDef="let element"> {{element.usuario}} </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef style="width: 120px; min-width: 120px; text-align: center;"> Acciones </th>
          <td mat-cell *matCellDef="let element" style="width: 120px; min-width: 120px; white-space: nowrap; text-align: center;">

            <button mat-icon-button color="primary" (click)="openEditDialog(element)">
              <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button color="warn" (click)="deleteAuditoria(element.id)">
              <mat-icon>delete</mat-icon>
            </button>

          </td>
        </ng-container>

        <!-- Rendering rows (Angular manages the loop automatically) -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <!-- Paginator -->
      <mat-paginator [pageSizeOptions]="[2, 5, 10, 20]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
