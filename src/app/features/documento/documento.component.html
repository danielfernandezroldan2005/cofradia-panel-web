<div class="documento-container">
  <h2>Gestión Documental</h2>
  <p>Listado oficial de actas, contratos y normativas de la secretaría.</p>

  <mat-card class="mat-elevation-z4">
    <mat-card-content>
      <!-- Header row containing Search bar and "Añadir Documento" button -->
      <div class="table-header">
        <mat-form-field appearance="outline" class="buscador-documentos">
          <mat-label>Buscar documentos...</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Acta">
        </mat-form-field>

        <button mat-flat-button color="primary" (click)="openAddDialog()">
          Añadir Documento
        </button>
      </div>

      <table mat-table [dataSource]="dataSource">

        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> Nº </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <!-- Titulo Column -->
        <ng-container matColumnDef="titulo">
          <th mat-header-cell *matHeaderCellDef> Título </th>
          <td mat-cell *matCellDef="let element"> {{element.titulo}} </td>
        </ng-container>

        <!-- Tipo Column -->
        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef> Tipo </th>
          <td mat-cell *matCellDef="let element"> {{element.tipo}} </td>
        </ng-container>

        <!-- Fecha Creacion Column -->
        <ng-container matColumnDef="fechaCreacion">
          <th mat-header-cell *matHeaderCellDef> Fecha de Creación </th>
          <td mat-cell *matCellDef="let element"> {{element.fechaCreacion}} </td>
        </ng-container>

        <!-- Enlace Archivo Column -->
        <ng-container matColumnDef="enlaceArchivo">
          <th mat-header-cell *matHeaderCellDef> Enlace al Archivo </th>
          <td mat-cell *matCellDef="let element">
            <a [href]="element.enlaceArchivo" target="_blank" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 4px;">
              <mat-icon style="font-size: 18px; width: 18px; height: 18px;">open_in_new</mat-icon>
              <span>Ver archivo</span>
            </a>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef style="width: 120px; min-width: 120px; text-align: center;"> Acciones </th>
          <td mat-cell *matCellDef="let element" style="width: 120px; min-width: 120px; white-space: nowrap; text-align: center;">

            <button mat-icon-button color="primary" (click)="openEditDialog(element)">
              <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button color="warn" (click)="deleteDocumento(element.id)">
              <mat-icon>delete</mat-icon>
            </button>

          </td>
        </ng-container>

        <!-- Rendering rows (Angular manages the loop automatically) -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <!-- Paginator -->
      <mat-paginator [pageSizeOptions]="[2, 5, 10, 20]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
