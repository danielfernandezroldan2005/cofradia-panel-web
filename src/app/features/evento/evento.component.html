<div class="evento-container">
  <h2>Foro de Eventos</h2>
  <p>Listado oficial y administración de eventos de la cofradía.</p>

  <!-- Action bar above the table -->
  <div class="action-bar" style="margin-bottom: 16px; display: flex; justify-content: flex-end;">
    <button mat-flat-button color="primary" (click)="openAddDialog()">
      Add New Event
    </button>
  </div>

  <!-- mat-elevation-z8 gives shadow effect -->
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <!-- Titulo Column -->
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef> Título </th>
      <td mat-cell *matCellDef="let element"> {{element.titulo}} </td>
    </ng-container>

    <!-- Fecha Column -->
    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef> Fecha </th>
      <td mat-cell *matCellDef="let element"> {{element.fecha}} </td>
    </ng-container>

    <!-- Descripcion Column -->
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef> Descripción </th>
      <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
    </ng-container>

    <!-- Ubicacion Column -->
    <ng-container matColumnDef="ubicacion">
      <th mat-header-cell *matHeaderCellDef> Ubicación </th>
      <td mat-cell *matCellDef="let element"> {{element.ubicacion}} </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element" style="display: flex; gap: 8px; align-items: center; padding-top: 6px;">

        <button mat-flat-button color="accent" (click)="openEditDialog(element)">
          Edit
        </button>

        <button mat-flat-button color="warn" (click)="deleteEvento(element.id)">
          Delete
        </button>

      </td>
    </ng-container>

    <!-- Rendering rows (Angular manages the loop automatically) -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- Filter bar -->
  <mat-form-field appearance="outline" class="buscador-eventos">
    <mat-label>Buscar por título, descripción o ubicación...</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Cabildo">
  </mat-form-field>

  <!-- Paginator -->
  <mat-paginator [pageSizeOptions]="[2, 5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
