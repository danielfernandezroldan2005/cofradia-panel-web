<h2 mat-dialog-title>{{ isEditMode ? 'Edit Event' : 'Add New Event' }}</h2>

<mat-dialog-content>
  <form [formGroup]="eventoForm" class="form-container">

    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="titulo" placeholder="Enter title">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput type="date" formControlName="fecha">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="descripcion" placeholder="Enter description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Location</mat-label>
      <input matInput formControlName="ubicacion" placeholder="Enter location">
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="eventoForm.invalid" (click)="onSubmit()">
    Save
  </button>
</mat-dialog-actions>
